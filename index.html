<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tiếng Trung Minxian - HSK1 3.0</title>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --ink:#1f2937;
  --muted:#6b7280;
  --blue:#dcecff;
  --blue2:#cfe4ff;
  --shadow:0 10px 28px rgba(0,0,0,.10);
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%,rgba(255,221,145,.30),transparent 28%),
    radial-gradient(circle at 90% 8%,rgba(147,197,253,.22),transparent 26%),
    var(--bg);
  color:var(--ink);
  font-family:"Times New Roman",Times,serif;
}

.zh{
  font-family:"KaiTi","STKaiti","Kaiti SC","楷体","Songti SC",serif;
}

.py{
  font-family:"Heiti SC","STHeiti","PingFang SC","Microsoft YaHei",Arial,sans-serif;
  font-weight:700;
}

.vi{
  font-family:"Times New Roman",Times,serif;
}

.wrap{
  width:min(900px,92vw);
  margin:auto;
  padding:46px 0 70px;
}

header{
  text-align:center;
  margin-bottom:28px;
}

.brand{
  font-size:clamp(34px,5vw,54px);
  font-weight:700;
  margin:0 0 8px;
}

.subtitle{
  color:var(--muted);
  font-size:18px;
  margin:0;
}

.course{
  background:var(--card);
  border-radius:28px;
  padding:32px;
  box-shadow:var(--shadow);
}

.course h2{
  text-align:center;
  font-size:34px;
  margin:0 0 26px;
}

.lesson-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}

.lesson{
  display:flex;
  align-items:center;
  gap:15px;
  min-height:92px;
  padding:18px 20px;
  border-radius:20px;
  background:linear-gradient(145deg,var(--blue),#eef5ff);
  color:var(--ink);
  text-decoration:none;
  transition:.2s ease;
  border:1px solid rgba(80,120,170,.08);
}

.lesson:hover{
  transform:translateY(-3px);
  background:linear-gradient(145deg,var(--blue2),#eaf3ff);
  box-shadow:0 8px 18px rgba(54,92,130,.12);
}

.icon{
  width:54px;
  height:54px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:#fff;
  font-size:30px;
  flex:0 0 auto;
}

.lesson-text{
  text-align:left;
}

.lesson-title{
  font-size:27px;
  line-height:1.1;
  margin-bottom:5px;
}

.lesson-desc{
  font-size:15px;
  color:#65758a;
}

footer{
  text-align:center;
  margin-top:34px;
  line-height:1.7;
  font-size:18px;
}

@media(max-width:650px){
  .wrap{padding-top:28px}
  .course{padding:20px}
  .lesson-grid{grid-template-columns:1fr}
  .lesson{min-height:82px}
}
</style>
</head>

</header>

<section class="course">
  <h2>HSK1-3.0</h2>

  <div class="lesson-grid">

    <a class="lesson" href="./HSK1-3.0-第1课-复习-font-fixed.html">

      <div class="lesson-text">
        <div class="lesson-title zh">第1课</div>

      </div>
    </a>

    <a class="lesson" href="./HSK1-3.0-第2课-复习-font-fixed.html">

    <a class="lesson" href="./HSK1-3.0-第3课.html">

        <div class="lesson-title zh">第3课</div>
        <div class="lesson-desc vi">Bài 3</div>

    </a>

    <a class="lesson" href="./HSK-3.0-第4课.html">

    <a class="lesson" href="./HSK1-3.0-第5课-font-fixed.html">

    <a class="lesson" href="./HSK1-3.0-第6课-font-fixed.html">

        <div class="lesson-title zh">第6课</div>

    <a class="lesson" href="./HSK1-3.0-第7课.html">
      <div class="icon">7️⃣</div>

    </a>

  </div>
</section>

<footer>
  <div><b>Tiếng Trung Minxian (Minxian.chinese)</b></div>
  <div>Zalo: 0833312711</div>
</footer>

</div>
</body>
</html>
